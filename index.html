function home(){app.innerHTML=`<div class="hero"><h1>Assalamu ʿalaykum 🌙</h1><p class="muted">Your all-in-one Islamic knowledge companion: Qur’an, salah, duas, adhkar, Qibla, prayer times, calendar and study.</p><div class="toolbar"><button class="btn alt" onclick="setTab('prayer')">🕌 Today’s Salah</button><button class="btn ghost" onclick="setTab('qibla')">🧭 Find Qibla</button><button class="btn ghost" onclick="randomAyah()">✦ Random ayah</button></div><div id="homePrayer" class="notice">Loading today’s prayer times…</div></div><div class="grid">${[['🕌','Salah & Prayer Times','Five daily prayers, countdown, calculation settings and reminders.','prayer'],['🧭','Qibla Compass','Use your device compass or calculate the Qibla bearing for your location.','qibla'],['🤲','Duas & Adhkar','Qur’anic and hadith-based supplications with references.','duas'],['✨','Names of Allah','Study the beautiful names with Arabic, transliteration and meanings.','allah'],['📿','Tasbih','A digital dhikr counter with targets and saved progress.','tasbih'],['🌙','Islamic Calendar','View today’s Hijri date and convert dates.','calendar'],['🧭','My Islamic Journey','Choose your level and follow a structured path from beginner to serious study.','journey'],['📚','Learn Islam','Pillars, prayer guide and common Islamic phrases.','learn'],['🌿','Sunnah','Practical Sunnah topics and daily-life guidance.','sunnah'],['⚖️','Fiqh & Sharia','Halal/haram, Sharia, responsibilities and scholarly differences.','fiqh'],['❓','Is this permissible?','Explore a question using evidence categories, then see when a qualified scholar is needed.','permissible'],['📚','Islamic Books','History, seerah, hadith, tafsir, aqeedah and self-development reading list.','books'],['👥','People of Islam','Prophets, Messengers, Sahaba, Ahl al-Bayt and scholars.','figures'],['📜','Islamic Stories','Stories from the Qur’an, Sunnah and Islamic history, with source notes.','stories'],['🌸','Women in Islam','Learn about Maryam, Khadijah, Aishah, Fatimah and other important women.','women'],['👤','My Profile','Create a local profile and choose a cute animal avatar.','profile'],['📖','Qur’an','Read all 114 surahs, search, listen, save and take notes.','quran']].map(x=>`<div class="card click" onclick="setTab('${x[3]}')"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[2]}</div></div>`).join('')}</div>`;loadPrayer(false)}
async function loadPrayer(show=true){try{let url=`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(state.city)}&country=${encodeURIComponent(state.country)}&method=${state.method}&school=${state.school}`;let r=await fetch(url);let j=await r.json();if(!j.data)throw Error('No prayer data');state.prayerData=j.data;if(show)renderPrayerData();else{let h=document.getElementById('homePrayer');if(h){let t=j.data.timings;h.innerHTML=`<b>Today in ${esc(state.city)}</b><br>Fajr ${esc(t.Fajr)} • Dhuhr ${esc(t.Dhuhr)} • Asr ${esc(t.Asr)} • Maghrib ${esc(t.Maghrib)} • Isha ${esc(t.Isha)}<br><button class="btn ghost" style="margin-top:8px" onclick="setTab('prayer')">Open full prayer panel →</button>`}}}catch(e){let h=document.getElementById('homePrayer');if(h)h.innerHTML='Prayer times could not load. Check your connection or open Salah to choose another location.'}}
function prayerPage(){app.innerHTML=`<div class="hero"><h1>🕌 Salah & Prayer Times</h1><p class="muted">Prayer times are calculated for your selected location. Different calculation methods can produce slightly different times.</p><div class="settings-grid"><div><label>City</label><input class="field" id="city" value="${esc(state.city)}"></div><div><label>Country</label><input class="field" id="country" value="${esc(state.country)}"></div><div><label>Calculation method</label><select class="field" id="method"><option value="3">Muslim World League</option><option value="4">Umm al-Qura, Makkah</option><option value="2">ISNA</option><option value="1">Egyptian General Authority</option><option value="8">Gulf Region</option><option value="9">Kuwait</option><option value="12">UOIF</option></select></div><div><label>Asr school</label><select class="field" id="school"><option value="0">Shafi‘i / Standard</option><option value="1">Hanafi</option></select></div></div><div class="toolbar"><button class="btn" onclick="savePrayerSettings()">Update times</button><button class="btn ghost" onclick="useMyLocation()">📍 Use my location</button><button class="btn ghost" onclick="requestNotifications()">🔔 ${state.notifications?'Notifications on':'Enable reminders'}</button></div><div id="notificationStatus" class="small muted"></div></div><div id="prayerPanel" class="card">Loading prayer times…</div><div class="notice">Reminder note: browser notifications require permission, and reliable background delivery while the app is completely closed is limited on ordinary web PWAs. For a future Android app, we can add native scheduled notifications.</div>`;document.getElementById('method').value=String(state.method);document.getElementById('school').value=String(state.school);loadPrayer(true)}
function renderPrayerData(){let d=state.prayerData;if(!d)return;let t=d.timings;let names=prayers.filter(x=>x[0]!=='Sunrise');let now=new Date();let next=null;for(const p of names){let [h,m]=t[p[0]].split(':').map(Number);let dt=new Date();dt.setHours(h,m,0,0);if(dt>now){next={name:p[0],dt};break}}if(!next){let [h,m]=t.Fajr.split(':').map(Number);next={name:'Fajr',dt:new Date(Date.now()+86400000)};next.dt.setHours(h,m,0,0)}document.getElementById('prayerPanel').innerHTML=`<div class="row"><div><b>${esc(state.city)}, ${esc(state.country)}</b><div class="muted">${esc(d.date.readable)} • ${esc(d.date.hijri.day)} ${esc(d.date.hijri.month.en)} ${esc(d.date.hijri.year)} AH</div></div><span class="status">Next: ${esc(next.name)}</span></div>${prayers.map(p=>`<div class="prayer ${p[0]===next.name?'next':''}"><span><b>${p[0]}</b><div class="small muted">${p[1]}</div></span><span class="time">${esc(t[p[0]])}</span></div>`).join('')}<div class="hero" style="margin:14px 0 0;padding:14px"><div class="muted">Time until ${esc(next.name)}</div><div id="countdown" class="countdown">—</div></div>`;startCountdown(next.dt)}
let countdownTimer;function startCountdown(dt){clearInterval(countdownTimer);let tick=()=>{let ms=Math.max(0,dt-new Date()),s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;let el=document.getElementById('countdown');if(el)el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};tick();countdownTimer=setInterval(tick,1000)}
function savePrayerSettings(){state.city=document.getElementById('city').value.trim()||'Nairobi';state.country=document.getElementById('country').value.trim()||'Kenya';state.method=Number(document.getElementById('method').value);state.school=Number(document.getElementById('school').value);localStorage.setItem('deenCity',state.city);localStorage.setItem('deenCountry',state.country);localStorage.setItem('deenMethod',state.method);localStorage.setItem('deenSchool',state.school);loadPrayer(true);toast('Prayer settings updated ✓')}
function useMyLocation(){if(!navigator.geolocation)return toast('Location is not supported on this device');navigator.geolocation.getCurrentPosition(async p=>{let {latitude,longitude}=p.coords;try{let r=await fetch(`https://api.aladhan.com/v1/timings/${Math.floor(Date.now()/1000)}?latitude=${latitude}&longitude=${longitude}&method=${state.method}&school=${state.school}`);let j=await r.json();if(j.data){state.prayerData=j.data;renderPrayerData();toast('Using your device coordinates ✓')}}catch(e){toast('Could not load prayer times for those coordinates')}},()=>toast('Location permission was not granted'))}
async function requestNotifications(){if(!('Notification' in window)){toast('Notifications are not supported here');return}let p=await Notification.requestPermission();state.notifications=p==='granted';localStorage.setItem('deenNotifications',state.notifications?'1':'0');let el=document.getElementById('notificationStatus');if(el)el.textContent=state.notifications?'Notifications are enabled while supported by this browser.':'Notification permission was not granted.';if(state.notifications)new Notification('Ilm',{body:'Prayer reminders are enabled. Keep the app/browser permitted to notify you.'});}
async function quranHome(){app.innerHTML='<div class="hero"><h1>Qur’an</h1><p class="muted">114 surahs • Arabic Uthmani text • English Sahih International translation</p></div><div id="surahGrid" class="grid"><div class="empty">Loading surahs…</div></div>';try{if(!state.surahs.length){let r=await fetch('https://api.alquran.cloud/v1/surah');let j=await r.json();state.surahs=j.data||[]}document.getElementById('surahGrid').innerHTML=state.surahs.map(s=>`<div class="card click" onclick="openSurah(${s.number})"><div class="row"><b>${s.number}. ${esc(s.englishName)}</b><span class="pill">${esc(s.revelationType)}</span></div><h3 dir="rtl">${esc(s.name)}</h3><div class="muted">${esc(s.englishNameTranslation)} • ${s.numberOfAyahs} ayahs</div></div>`).join('')}catch(e){document.getElementById('surahGrid').innerHTML='<div class="empty">Could not load the Qur’an. Check your connection and try again.</div>'}}
async function openSurah(n){state.tab='quran';state.lastSurah=n;localStorage.setItem('deenLastSurah',n);renderNav();app.innerHTML='<div class="empty">Loading surah…</div>';try{let r=await fetch(`https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,en.sahih`);let j=await r.json();let ar=j.data?.find(x=>x.edition.identifier==='quran-uthmani'),en=j.data?.find(x=>x.edition.identifier==='en.sahih');state.surah={ar,en};let pct=Math.round((n/114)*100);app.innerHTML=`<div class="toolbar"><button class="btn ghost" onclick="quranHome()">← All surahs</button><button class="btn ghost" onclick="changeSurah(-1)" ${n===1?'disabled':''}>← Previous</button><button class="btn ghost" onclick="changeSurah(1)" ${n===114?'disabled':''}>Next →</button></div><div class="hero"><h1>${esc(ar.englishName)}</h1><p class="muted">${esc(ar.englishNameTranslation)} • ${ar.numberOfAyahs} ayahs</p><div class="progress"><i style="width:${pct}%"></i></div><div class="small muted">Surah ${n} of 114</div><div class="toolbar"><button class="btn ghost" onclick="changeFont(-2)">A−</button><button class="btn ghost" onclick="changeFont(2)">A+</button></div></div>${ar.ayahs.map((a,i)=>{let t=en?.ayahs?.[i]?.text||'';let ref=`${ar.number}:${a.numberInSurah}`;return `<article class="ayah"><div class="arabic" style="font-size:${state.fontSize}px" translate="no">${esc(a.text)} <span class="pill">${a.numberInSurah}</span></div><div class="translation">${esc(t)}</div><div class="ref">${esc(ref)}</div><div class="actions"><button class="btn" onclick='saveAyah(${JSON.stringify(ref)},${JSON.stringify(a.text)},${JSON.stringify(t)})'>🔖 Save</button><button class="btn ghost" onclick="openAyahAudio(${a.number},${JSON.stringify(ar.englishName)},${a.numberInSurah})">▶ Listen</button><button class="btn ghost" onclick='noteAyah(${JSON.stringify(ref)})'>📝 Note</button></div></article>`}).join('')}`;}catch(e){app.innerHTML='<div class="empty">Unable to load this surah.</div>'}}
function changeSurah(d){let n=state.lastSurah+d;if(n>=1&&n<=114)openSurah(n)}function changeFont(d){setFont(Math.max(20,Math.min(42,state.fontSize+d)))}function setFont(v){state.fontSize=Number(v);localStorage.setItem('deenFont',state.fontSize);if(state.surah)openSurah(state.lastSurah)}let qAudio=null,qAudioQueue=[],qAudioIndex=0,qAudioRepeat=false,qAudioMode="ayah";
function showAudio(title,status="Ready"){document.getElementById("audioTitle").textContent=title;document.getElementById("audioStatus").textContent=status;document.getElementById("audioDock").classList.add("open")}
function playAudioUrl(url){if(qAudio){qAudio.pause();qAudio=null}qAudio=new Audio(url);qAudio.onplay=()=>document.getElementById("audioStatus").textContent="Playing";qAudio.onpause=()=>document.getElementById("audioStatus").textContent="Paused";qAudio.onended=()=>{if(qAudioRepeat){playAudioUrl(url);return}if(qAudioMode==="surah"&&qAudioIndex<qAudioQueue.length-1){qAudioIndex++;playAudioUrl(qAudioQueue[qAudioIndex])}else if(qAudioMode==="surah-repeat"){qAudioIndex=0;playAudioUrl(qAudioQueue[0])}else document.getElementById("audioStatus").textContent="Finished"};qAudio.play().catch(()=>document.getElementById("audioStatus").textContent="Tap Play to start audio")}
function openAyahAudio(globalNum,surah,ayah){qAudioMode="ayah";qAudioRepeat=false;qAudioQueue=[`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalNum}.mp3`];qAudioIndex=0;showAudio(`${surah} • Ayah ${ayah}`);playAudioUrl(qAudioQueue[0])}
function audioRepeatAyah(){if(!qAudioQueue.length)return; qAudioMode="ayah";qAudioRepeat=true;showAudio(document.getElementById("audioTitle").textContent,"Repeating this ayah");playAudioUrl(qAudioQueue[0])}
function audioPlaySurah(repeat){if(!state.surah?.ar?.ayahs?.length){toast("Open a surah first");return}qAudioMode=repeat?"surah-repeat":"surah";qAudioRepeat=false;qAudioQueue=state.surah.ar.ayahs.map(a=>`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${a.number}.mp3`);qAudioIndex=0;showAudio(`${state.surah.ar.englishName} • ${repeat?"Repeat":"Full surah"}`);playAudioUrl(qAudioQueue[0])}
function audioToggle(){if(!qAudio){if(qAudioQueue.length)playAudioUrl(qAudioQueue[qAudioIndex]);return}if(qAudio.paused)qAudio.play();else qAudio.pause()}
function audioStop(){if(qAudio){qAudio.pause();qAudio.currentTime=0}document.getElementById("audioStatus").textContent="Stopped"}
function playAyah(num){openAyahAudio(num,state.surah?.ar?.englishName||"Qur’an",state.surah?.ar?.ayahs?.find(a=>a.number===num)?.numberInSurah||"")}
function saveAyah(ref,ar,en){if(!state.saved.some(x=>x.ref===ref)){state.saved.push({ref,ar,en});localStorage.setItem('deenSaved',JSON.stringify(state.saved));toast('Saved ✓')}else toast('Already saved')}
function noteAyah(ref){let old=state.notes[ref]||'';document.getElementById('modalBody').innerHTML=`<h2>Note · ${esc(ref)}</h2><textarea class="field" id="noteText" placeholder="Write your reflection or study note…">${esc(old)}</textarea><button class="btn" onclick='saveNote(${JSON.stringify(ref)})'>Save note</button>`;document.getElementById('modal').classList.add('open')}
function saveNote(ref){state.notes[ref]=document.getElementById('noteText').value;localStorage.setItem('deenNotes',JSON.stringify(state.notes));document.getElementById('modal').classList.remove('open');toast('Note saved ✓')}
function hadith(){app.innerHTML=`<div class="hero"><h1>📜 Hadith Library</h1><p class="muted">Explore major hadith collections and study narrations connected to individual Companions and women narrators. The app links to the source rather than copying entire collections.</p><div class="tabs"><button class="active" onclick="hadithSection('collections',this)">Collections</button><button onclick="hadithSection('narrators',this)">Narrators</button><button onclick="hadithSection('women',this)">Women narrators</button></div><div id="hadithContent"></div></div>`;hadithSection('collections',document.querySelector('.tabs button'))}
function hadithSection(type,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let e=document.getElementById('hadithContent');if(type==='collections'){e.innerHTML=`<div class="grid">${collections.filter(x=>x[1].includes('Hadith')).map(x=>`<div class="card"><span class="pill">${esc(x[1])}</span><h3>${esc(x[0])}</h3><p class="muted">${esc(x[2])}</p><button class="btn" onclick="window.open('${x[3]}','_blank','noopener')">Open source ↗</button></div>`).join('')}</div>`}else{let arr=type==='women'?hadithNarrators.filter(x=>x[2]==='Woman'):hadithNarrators; e.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Search a narrator</h3><input id="narratorSearch" class="field" placeholder="e.g. Abu Hurayrah, Aishah, Ibn Abbas…" oninput="filterNarrators()"><div class="small muted">The source search can also find narrations for names not yet in this starter directory.</div></div><div id="narratorGrid" class="grid">${arr.map(x=>`<div class="card"><span class="pill">${esc(x[2])}</span><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><button class="btn" onclick="window.open('https://sunnah.com/search?q=${encodeURIComponent(x[0])}','_blank','noopener')">Search narrations ↗</button></div>`).join('')}</div><div class="notice">“All Sahaba” is a very large historical population, so this directory is expandable rather than pretending a short list is exhaustive. Use the source search to find narrations by a Companion or narrator name, and verify chains and grading in the original collection.</div>`}}

function filterNarrators(){let q=(document.getElementById('narratorSearch')?.value||'').toLowerCase();document.querySelectorAll('#narratorGrid .card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'':'none')}
function duasPage(){app.innerHTML=`<div class="hero"><h1>🤲 Duas & Adhkar</h1><p class="muted">A starter collection of Qur’anic and hadith-based supplications. References are shown so you can verify the wording.</p></div>${duas.map(d=>`<article class="ayah"><h3>${esc(d[0])}</h3><div class="dua-ar" translate="no">${esc(d[1])}</div><div class="translation">${esc(d[2])}</div><div class="ref">${esc(d[3])}</div></article>`).join('')}`}
function allahPage(){app.innerHTML=`<div class="hero"><h1>✨ Names of Allah</h1><p class="muted">Study the Arabic name, transliteration and a concise English meaning. Meanings are explanatory, not substitutes for scholarly study.</p></div><div class="grid">${names.map((n,i)=>`<article class="card"><span class="pill">${i+1}</span><div class="name-ar" translate="no">${esc(n[0])}</div><h3>${esc(n[1])}</h3><div class="muted">${esc(n[2])}</div></article>`).join('')}</div>`}
function qiblaPage(){let cs=localStorage.getItem('deenCompassStyle')||'classic';app.innerHTML=`<div class="hero"><h1>🧭 Qibla Compass</h1><p class="muted">The Qibla bearing is calculated toward the Kaaba. For a live compass, your browser must provide device-orientation access.</p><div class="toolbar"><button class="btn" onclick="startCompass()">Enable compass</button><button class="btn ghost" onclick="getQiblaLocation()">📍 Use my location</button><button class="btn ghost" onclick="compassPanel()">🎨 Customize</button></div><div id="qiblaStatus" class="small muted">Qibla bearing: calculating…</div><div id="compass" class="compass compass-style-${cs}"><div class="n">N</div><div id="needle" class="needle"></div><div class="kaaba">🕋</div></div><div class="card"><b>How to use</b><p class="muted">Hold your phone flat. Allow motion/location permission when requested. The needle points toward the Qibla bearing relative to your device heading.</p></div></div>`;calculateQiblaForCity()}
function calculateQibla(lat,lon){let kaabaLat=21.422487* Math.PI/180,kaabaLon=39.826206*Math.PI/180,la=lat*Math.PI/180,lo=lon*Math.PI/180;let y=Math.sin(kaabaLon-lo),x=Math.cos(la)*Math.tan(kaabaLat)-Math.sin(la)*Math.cos(kaabaLon-lo);return (Math.atan2(y,x)*180/Math.PI+360)%360}
async function calculateQiblaForCity(){try{if(!state.prayerData)await loadPrayer(false);let lat=state.prayerData?.meta?.latitude,lon=state.prayerData?.meta?.longitude;if(lat!=null&&lon!=null){state.qibla=calculateQibla(Number(lat),Number(lon));updateCompass();document.getElementById('qiblaStatus').textContent=`Qibla bearing from ${state.city}: ${state.qibla.toFixed(1)}° from true north.`;return}}catch(e){}document.getElementById('qiblaStatus').textContent='Qibla bearing: use location to calculate'}
function getQiblaLocation(){if(!navigator.geolocation)return toast('Location is not supported');navigator.geolocation.getCurrentPosition(p=>{state.qibla=calculateQibla(p.coords.latitude,p.coords.longitude);updateCompass();let e=document.getElementById('qiblaStatus');if(e)e.textContent=`Qibla bearing from your coordinates: ${state.qibla.toFixed(1)}° from true north.`},()=>toast('Location permission was not granted'))}
function startCompass(){if(typeof DeviceOrientationEvent==='undefined')return toast('Compass sensors are not available');let begin=()=>window.addEventListener('deviceorientationabsolute',handleOrientation,true);if(typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().then(p=>p==='granted'?begin():toast('Compass permission denied')).catch(()=>toast('Could not access compass'));else begin();toast('Compass enabled ✓')}
function handleOrientation(e){let heading=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:0);state.compassHeading=heading;updateCompass()}
function updateCompass(){let n=document.getElementById('needle');if(!n)return;let deg=(state.qibla-state.compassHeading+360)%360;n.style.transform=`translate(-50%,-100%) rotate(${deg}deg)`}
function tasbihPage(){app.innerHTML=`<div class="hero"><h1>📿 Tasbih</h1><p class="muted">Tap the counter for dhikr. Progress is stored on this device.</p><div class="tabs">${[33,34,99,100].map(x=>`<button class="${state.tasbihTarget===x?'active':''}" onclick="setTasbihTarget(${x})">${x}</button>`).join('')}<button onclick="setTasbihTarget(0)" class="${state.tasbihTarget===0?'active':''}">∞</button></div><div class="card"><div class="muted" style="text-align:center">Tap to count</div><div id="tasbihCount" class="counter">${state.tasbih}</div><div class="zikr" id="zikrText">سُبْحَانَ اللَّهِ</div><div class="toolbar" style="justify-content:center"><button class="btn alt" onclick="countTasbih()">+1 Dhikr</button><button class="btn ghost" onclick="resetTasbih()">Reset</button><button class="btn ghost" onclick="changeZikr()">Change phrase</button></div></div></div>`}
let zikrs=['سُبْحَانَ اللَّهِ','الْحَمْدُ لِلَّهِ','اللَّهُ أَكْبَرُ','أَسْتَغْفِرُ اللَّهَ','لَا إِلَهَ إِلَّا اللَّهُ'];let zikrIndex=0;function countTasbih(){state.tasbih++;if(state.tasbihTarget&&state.tasbih>state.tasbihTarget)state.tasbih=1;localStorage.setItem('deenTasbih',state.tasbih);let e=document.getElementById('tasbihCount');if(e)e.textContent=state.tasbih;if(navigator.vibrate)navigator.vibrate(12)}function resetTasbih(){state.tasbih=0;localStorage.setItem('deenTasbih','0');let e=document.getElementById('tasbihCount');if(e)e.textContent=0}function setTasbihTarget(x){state.tasbihTarget=x;localStorage.setItem('deenTasbihTarget',x);tasbihPage()}function changeZikr(){zikrIndex=(zikrIndex+1)%zikrs.length;let e=document.getElementById('zikrText');if(e)e.textContent=zikrs[zikrIndex]}
async function enablePrayerNotifications(){if(!('Notification' in window)){toast('This browser does not support notifications');return}let p=await Notification.requestPermission();let e=document.getElementById('notifStatus');if(e)e.textContent=p==='granted'?'Notifications enabled ✓':`Permission: ${p}`;if(p==='granted'){localStorage.setItem('deenPrayerNotify','1');schedulePrayerCheck();toast('Prayer reminders enabled')}else toast('Notification permission was not granted')}
function schedulePrayerCheck(){clearInterval(window.deenPrayerTimer);window.deenPrayerTimer=setInterval(()=>{if(!state.prayerData||Notification.permission!=='granted'||localStorage.getItem('deenPrayerNotify')!=='1')return;let t=state.prayerData.timings||{},now=new Date();let hm=now.toTimeString().slice(0,5);for(let n of ['Fajr','Dhuhr','Asr','Maghrib','Isha']){if(t[n]&&t[n].slice(0,5)===hm){let key=`deenNotified_${now.toISOString().slice(0,10)}_${n}`;if(!localStorage.getItem(key)){new Notification(`${n} time 🕌`,{body:`It is time for ${n} prayer. May Allah accept your salah.`,icon:'icons/icon-192.png'});localStorage.setItem(key,'1')}}}},30000)}
function updateNotificationStatus(){let e=document.getElementById('notifStatus');if(e)e.textContent=('Notification' in window)?(Notification.permission==='granted'?'Notifications enabled ✓':Notification.permission==='denied'?'Blocked':'Not enabled'):'Not supported'}
async function calendarPage(){app.innerHTML=`<div class="hero"><h1>🌙 Islamic Calendar</h1><p class="muted">Hijri dates can vary by moon sighting and calculation method. Use this as a calendar aid, not as a definitive local moon-sighting ruling.</p><div id="todayHijri">Loading…</div><div class="toolbar"><input class="field" style="max-width:220px" id="datePick" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn" onclick="convertDate()">Convert date</button></div><div id="calendarResult"></div></div><div class="card"><h3>Month view</h3><p class="muted">The full monthly prayer/Hijri calendar can be loaded for your selected city.</p><button class="btn" onclick="openCalendarExternal()">Open monthly calendar ↗</button></div>`;try{let r=await fetch(`https://api.aladhan.com/v1/gToH?date=${new Date().toISOString().slice(0,10).split('-').reverse().join('-')}`);let j=await r.json();let h=j.data?.hijri;if(h)document.getElementById('todayHijri').innerHTML=`<b>${esc(h.day)} ${esc(h.month.en)} ${esc(h.year)} AH</b> <span class="muted">(${esc(h.weekday.en)})</span>`}catch(e){document.getElementById('todayHijri').textContent='Could not load Hijri date.'}}
async function convertDate(){let v=document.getElementById('datePick').value;if(!v)return;let d=v.split('-').reverse().join('-');try{let r=await fetch(`https://api.aladhan.com/v1/gToH?date=${d}`);let j=await r.json(),h=j.data?.hijri;document.getElementById('calendarResult').innerHTML=h?`<div class="notice"><b>${esc(v)}</b> = ${esc(h.day)} ${esc(h.month.en)} ${esc(h.year)} AH</div>`:'<div class="notice">Could not convert that date.</div>'}catch(e){document.getElementById('calendarResult').innerHTML='<div class="notice">Conversion failed. Check your connection.</div>'}}
function openCalendarExternal(){window.open(`https://aladhan.com/calendar/${encodeURIComponent(state.city)}/${encodeURIComponent(state.country)}`,'_blank','noopener')}

function journeyPage(){let level=localStorage.getItem('ilmJourneyLevel')||'';let p=state.profile;app.innerHTML=`<div class="hero"><h1>🧭 My Islamic Journey</h1><p class="muted">Ilm changes what it recommends based on where you are. You can change your level anytime.</p><div class="settings-grid"><button class="card click" onclick="setJourney('beginner')"><h3>🌱 New to Islam</h3><p class="muted">I’m starting from the foundations.</p></button><button class="card click" onclick="setJourney('growing')"><h3>📖 Practicing Muslim</h3><p class="muted">I know the basics and want to grow.</p></button><button class="card click" onclick="setJourney('advanced')"><h3>🎓 Serious Student</h3><p class="muted">I want deeper source-based study.</p></button></div></div>${level?journeyTrack(level):`<div class="notice">Choose a level above to build your study path. Nothing is locked—you can explore the entire Ilm library at any time.</div>`}`}
function setJourney(level){localStorage.setItem('ilmJourneyLevel',level);journeyPage();toast('Learning path updated ✓')}
function journeyTrack(level){let t=journeyTracks[level];let done=JSON.parse(localStorage.getItem('ilmJourneyDone_'+level)||'[]');let pct=Math.round(done.length/t.steps.length*100);return `<div class="hero"><h2>${t.title}</h2><p class="muted">${t.desc}</p><div class="progress"><i style="width:${pct}%"></i></div><div class="small muted">${done.length}/${t.steps.length} steps complete · ${pct}%</div><div class="steps">${t.steps.map((x,i)=>`<div class="step"><b>${i+1}. ${esc(x[0])}</b><div class="muted">${esc(x[1])}</div><div class="toolbar"><button class="btn ghost" onclick="setTab('${x[2]}')">Study ↗</button><button class="btn ${done.includes(i)?'alt':'ghost'}" onclick="toggleJourneyStep('${level}',${i})">${done.includes(i)?'✓ Completed':'Mark complete'}</button></div></div>`).join('')}</div><div class="notice"><b>Evidence-first rule:</b> Ilm distinguishes Qur’an, authentic/graded hadith, scholarly interpretation and later historical reports. A learning path helps organize study; it does not replace qualified scholarship.</div></div>`}
function toggleJourneyStep(level,i){let k='ilmJourneyDone_'+level,d=JSON.parse(localStorage.getItem(k)||'[]');d=d.includes(i)?d.filter(x=>x!==i):[...d,i];localStorage.setItem(k,JSON.stringify(d));journeyPage()}
function learnPage(){app.innerHTML=`<div class="hero"><h1>📚 Learn Islam</h1><p class="muted">Start with a structured journey, then use the reference library to go deeper.</p><div class="toolbar"><button class="btn alt" onclick="setTab('journey')">🧭 Build my learning path</button></div><div class="tabs"><button class="active" onclick="learnSection('pillars',this)">Pillars</button><button onclick="learnSection('salah',this)">Salah guide</button><button onclick="learnSection('phrases',this)">Islamic phrases</button></div><div id="learnContent"></div></div>`;learnSection('pillars',document.querySelector('.tabs button'))}
function learnSection(type,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let e=document.getElementById('learnContent');if(type==='pillars')e.innerHTML=`<h2>Five Pillars of Islam</h2>${pillars.map((p,i)=>`<article class="step"><b>${p[0]}</b><h3>${p[1]}</h3><div class="muted">${p[2]}</div></article>`).join('')}<div class="notice">The pillars are described in the famous hadith of Jibril and other authentic narrations.</div>`;else if(type==='salah')e.innerHTML=`<h2>Basic Salah Sequence</h2><p class="muted">This is a simplified learning outline. Details can differ by madhhab, so study the complete prayer with a qualified teacher.</p><div class="steps">${salahSteps.map(s=>`<div class="step"><b>${s[0]}</b><div class="muted">${s[1]}</div></div>`).join('')}</div>`;else e.innerHTML=`<h2>Common Islamic phrases</h2>${phrases.map(p=>`<article class="card" style="margin:10px 0"><div class="dua-ar" translate="no">${esc(p[0])}</div><h3>${esc(p[1])}</h3><div><b>${esc(p[2])}</b></div><p class="muted">${esc(p[3])}</p></article>`).join('')}`}
function sunnahPage(){app.innerHTML=`<div class="hero"><h1>🌿 Sunnah</h1><p class="muted">A practical study guide to the Prophet ﷺ’s teachings, practice and approvals. Use the linked hadith collections for detailed evidence.</p></div><div class="grid">${sunnahTopics.map(x=>`<article class="card"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="muted small">${esc(x[2])}</div></article>`).join('')}</div><div class="notice">Sunnah is not a synonym for “optional.” Some Sunnah material concerns obligatory acts, recommended acts, manners, rulings and the Prophet’s ﷺ practice. Fiqh determines how a specific evidence is applied.</div>`}
function fiqhPage(){app.innerHTML=`<div class="hero"><h1>⚖️ Fiqh, Sharia & Permissibility</h1><p class="muted">A balanced study section. It distinguishes revelation from scholarly interpretation and flags areas where jurists differ.</p><div class="tabs"><button class="active" onclick="fiqhSection('overview',this)">Overview</button><button onclick="fiqhSection('menwomen',this)">Men & Women</button><button onclick="fiqhSection('halal',this)">Halal & Haram</button><button onclick="fiqhSection('differences',this)">Differences</button></div><div id="fiqhContent"></div></div>`;fiqhSection('overview',document.querySelector('.tabs button'))}
function permissiblePage(){app.innerHTML=`<div class="hero"><h1>❓ Is this permissible in Islam?</h1><p class="muted">A study aid for checking broad Islamic categories. It does <b>not</b> issue fatwas or replace a qualified scholar.</p><div class="notice"><b>How Ilm approaches this:</b> Qur’an and authentic Sunnah are primary sources; fiqh is the scholarly interpretation and application of those sources. A question may be obligatory, recommended, permissible, disliked or prohibited, and some issues have legitimate scholarly disagreement.</div><label class="small"><b>What are you asking about?</b></label><select id="permCategory" class="select" style="width:100%;margin:6px 0 12px"><option value="general">General / unsure</option><option value="food">Food & drink</option><option value="money">Money & business</option><option value="worship">Worship</option><option value="clothing">Clothing & appearance</option><option value="marriage">Marriage & relationships</option><option value="entertainment">Entertainment</option><option value="medicine">Medicine & health</option></select><textarea id="permQuestion" class="field" placeholder="Example: Is buying this type of product permissible?"></textarea><button class="btn" onclick="checkPermissible()">Check guidance</button><div id="permResult"></div></div><div class="grid"><article class="card"><h3>🟢 Mubah / Halal</h3><p>Permissible. No sin is attached to doing it merely because it is permissible.</p></article><article class="card"><h3>🔵 Recommended</h3><p>Encouraged acts can be rewarded, while leaving them is generally not sinful.</p></article><article class="card"><h3>🟡 Makruh</h3><p>Disliked acts should be avoided; exact consequences and classifications can differ by school.</p></article><article class="card"><h3>🔴 Haram</h3><p>Prohibited by Islamic law. A claim of haram should be supported by evidence rather than assumption.</p></article><article class="card"><h3>⭐ Wajib / Fard</h3><p>Obligatory acts are required when their conditions apply.</p></article><article class="card"><h3>⚠️ Scholarly difference</h3><p>Some questions have multiple recognized fiqh positions. Ilm should show the difference instead of pretending there is always one answer.</p></article></div>`}
function checkPermissible(){let q=document.getElementById('permQuestion').value.trim().toLowerCase(),cat=document.getElementById('permCategory').value,e=document.getElementById('permResult');if(!q){e.innerHTML='<div class="notice">Write the question first.</div>';return}let caution=['marriage','medicine','money'].includes(cat)||/(divorce|inheritance|riba|interest|loan|mortgage|medicine|drug|contracept|pregnan|marriage|nikah|custody|violence|criminal|investment)/.test(q);let obviousHaram=/(pork|wine|alcohol|gambling|casino|betting|riba|interest|steal|theft|brib|porn|adultery|zina)/.test(q);let text=obviousHaram?'<b>⚠️ Likely prohibited category:</b> your wording touches an area that Islamic sources explicitly or strongly address as prohibited. The exact circumstances still matter.':caution?'<b>🔎 Needs detailed fiqh:</b> this question can depend on circumstances, evidence, madhhab, contracts, medical facts or local law. Use Ilm to learn the principles, then ask a qualified scholar for a personal ruling.':'<b>📚 General guidance:</b> this needs to be checked against the Qur’an, authentic Sunnah and established fiqh principles. Ilm will not label something halal or haram merely because it “sounds Islamic.”';e.innerHTML=`<div class="notice" style="margin-top:14px">${text}<br><br><span class="muted">Category: ${esc(cat)} • Question: ${esc(q)}</span></div><div class="notice"><b>Important:</b> this tool is educational, not a fatwa service. For personal rulings, especially marriage, divorce, inheritance, finance, medicine or criminal matters, consult a qualified scholar.</div>`}
function fiqhPage(){app.innerHTML=`<div class="hero"><h1>⚖️ Fiqh, Sharia & Permissibility</h1><p class="muted">A balanced study section. It distinguishes revelation from scholarly interpretation and flags areas where jurists differ.</p><div class="tabs"><button class="active" onclick="fiqhSection('overview',this)">Overview</button><button onclick="fiqhSection('menwomen',this)">Men & Women</button><button onclick="fiqhSection('halal',this)">Halal & Haram</button><button onclick="fiqhSection('differences',this)">Differences</button></div><div id="fiqhContent"></div></div>`;fiqhSection('overview',document.querySelector('.tabs button'))}
function fiqhSection(type,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let e=document.getElementById('fiqhContent');let items=fiqhTopics;if(type==='menwomen')items=fiqhTopics.filter(x=>/Men|Women|Marriage/.test(x[0]));if(type==='halal')items=fiqhTopics.filter(x=>/Halal|Food|Business/.test(x[0]));if(type==='differences')items=fiqhTopics.filter(x=>/Sharia|Halal|Men|Women|Marriage|Business/.test(x[0]));e.innerHTML=items.map(x=>`<article class="card" style="margin:10px 0"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="notice">${esc(x[2])}</div></article>`).join('')+`<div class="notice"><b>Study rule:</b> when a ruling matters personally—marriage, divorce, inheritance, finance, medical treatment, halal certification or criminal law—consult a qualified scholar familiar with your madhhab and local law. This app is an educational reference, not a fatwa service.</div>`}
function figuresPage(filter='all'){let cats=['all','Prophets','Sahaba','Women','Ahl al-Bayt','Scholars'];app.innerHTML=`<div class="hero"><h1>👥 People & Figures in Islam</h1><p class="muted">Biographical introductions to people mentioned in Islamic sources. Prophets are not visually depicted; these cards use names and source references only.</p><div class="tabs">${cats.map(c=>`<button class="${filter===c?'active':''}" onclick="figuresPage('${c}')">${c==='all'?'All':c}</button>`).join('')}</div><div class="profile-grid">${figures.filter(f=>filter==='all'||f[1]===filter).map(f=>`<div class="card figure-card"><span class="pill figure-type">${esc(f[0])}</span><h3>${esc(f[2])}</h3><div class="arabic" style="font-size:20px">${esc(f[3])}</div><p>${esc(f[4])}</p><div class="source">Source guide: ${esc(f[5])}</div></div>`).join('')}</div><div class="notice">Names, dates and historical details can have scholarly differences. For disputed reports, the app will distinguish strong primary evidence from later historical narration.</div></div>`}
function storiesPage(){app.innerHTML=`<div class="hero"><h1>📜 Islamic Stories</h1><p class="muted">Stories from the Qur’an, authentic Sunnah and carefully identified historical sources. Source strength is shown for each story.</p><div class="grid">${islamicStories.map(x=>`<article class="card"><span class="pill">${esc(x[3])}</span><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="source"><b>Source:</b> ${esc(x[2])}</div></article>`).join('')}</div><div class="notice"><b>Source rule:</b> a popular Islamic story is not automatically an authentic hadith. Ilm separates Qur’anic accounts, hadith-based reports and later historical narration.</div></div>`}

function womenPage(){app.innerHTML=`<div class="hero"><h1>🌸 Women in Islam</h1><p class="muted">Women in the Qur’an, the Prophet’s ﷺ household, the female Companions, scholars and the principles Islam gives for dignity, worship, family, education and society.</p><div class="tabs"><button class="active" onclick="womenSection('figures',this)">Women & examples</button><button onclick="womenSection('hadith',this)">Women’s hadith</button><button onclick="womenSection('topics',this)">Topics</button></div><div id="womenContent"></div></div>`;womenSection('figures',document.querySelector('.tabs button'))}
function womenSection(type,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let e=document.getElementById('womenContent');if(type==='figures'){let arr=figures.filter(f=>f[1]==='Women');e.innerHTML=`<div class="profile-grid">${arr.map(f=>`<div class="card figure-card"><span class="pill">${esc(f[0])}</span><h3>${esc(f[2])}</h3><div class="arabic" style="font-size:20px">${esc(f[3])}</div><p>${esc(f[4])}</p><div class="source">${esc(f[5])}</div></div>`).join('')}</div>`}else if(type==='hadith'){let arr=hadithNarrators.filter(x=>x[2]==='Woman');e.innerHTML=`<div class="grid">${arr.map(x=>`<div class="card"><span class="pill">Female narrator</span><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><button class="btn" onclick="window.open('https://sunnah.com/search?q=${encodeURIComponent(x[0])}','_blank','noopener')">Search her narrations ↗</button></div>`).join('')}</div><div class="notice">Female Companions were important transmitters of knowledge. Search the original collections and inspect the hadith grading and chain rather than relying on unattributed social-media quotes.</div>`}else{let topics=[['Worship & spiritual equality','Men and women are both addressed by the Qur’an as responsible believers and worshippers.','Qur’an 33:35; 16:97'],['Women as teachers and scholars','Women in the early Muslim community transmitted hadith, taught knowledge and answered legal questions.','Sahih al-Bukhari; Sahih Muslim; biographical literature'],['Marriage & family','Marriage is treated as a serious covenant with rights and responsibilities for both spouses.','Qur’an 4:19; 30:21'],['Property & financial rights','The Qur’an explicitly recognises women’s entitlement to inheritance and property.','Qur’an 4:7; 4:32'],['Maryam, Asiyah and other examples','The Qur’an presents women as examples of faith, patience and devotion.','Qur’an 3:42; 66:11–12'],['Female Companions','Study Khadijah, Aishah, Fatimah, Hafsah, Umm Salamah, Asma and many other women of the first generations.','Hadith and early biographical sources']];e.innerHTML=topics.map(x=>`<article class="card" style="margin:10px 0"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><div class="source">${esc(x[2])}</div></article>`).join('')}}

function bookFilter(type,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');let list=type==='all'?bookShelf:bookShelf.filter(x=>x[0].toLowerCase().includes(type.toLowerCase()));document.getElementById('bookGrid').innerHTML=list.map(x=>`<article class="card"><span class="pill">${esc(x[0])}</span><h3>${esc(x[1])}</h3><p class="muted">${esc(x[2])}</p><button class="btn" onclick="window.open('${x[3]}','_blank','noopener')">Find source ↗</button></article>`).join('')}
function saved(){let notes=Object.entries(state.notes).filter(([,v])=>v.trim());app.innerHTML=`<div class="hero"><h1>Saved</h1><p class="muted">Bookmarks and notes are stored locally on this device.</p><div class="toolbar"><button class="btn ghost" onclick="exportData()">Export study data</button><button class="btn ghost" onclick="clearSaved()">Clear bookmarks</button></div></div><h2>Bookmarks</h2>${state.saved.length?state.saved.map((x,i)=>`<article class="ayah"><div class="ref">${esc(x.ref)}</div><div class="arabic" translate="no">${esc(x.ar)}</div><div class="translation">${esc(x.en)}</div><button class="btn ghost" onclick="removeSaved(${i})">Remove</button></article>`).join(''):'<div class="empty">Nothing saved yet.</div>'}<h2>Notes</h2>${notes.length?notes.map(([ref,v])=>`<article class="card"><b>${esc(ref)}</b><p>${esc(v)}</p><button class="btn ghost" onclick='noteAyah(${JSON.stringify(ref)})'>Edit</button></article>`).join(''):'<div class="empty">No notes yet.</div>'}`}
function removeSaved(i){state.saved.splice(i,1);localStorage.setItem('deenSaved',JSON.stringify(state.saved));saved()}function clearSaved(){if(confirm('Remove all saved ayahs from this device?')){state.saved=[];localStorage.setItem('deenSaved','[]');saved()}}function exportData(){let data=JSON.stringify({saved:state.saved,notes:state.notes,exportedAt:new Date().toISOString()},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ilm-study-data.json';a.click();URL.revokeObjectURL(url)}
async function searchQ(){let q=document.getElementById('search').value.trim();if(!q)return;state.tab='quran';renderNav();app.innerHTML='<div class="empty">Searching Qur’an…</div>';try{let r=await fetch('https://api.alquran.cloud/v1/search/'+encodeURIComponent(q)+'/all/en.sahih');let j=await r.json(),matches=j.data?.matches||[];let html='<div class="hero"><h1>Search results</h1><p class="muted">'+matches.length+' result(s) for “'+esc(q)+'”</p></div>';if(!matches.length)html+='<div class="empty">No results found.</div>';else matches.forEach(m=>{html+='<article class="ayah"><div class="ref">'+m.surah.number+':'+m.numberInSurah+' • '+esc(m.surah.englishName)+'</div><div class="translation">'+esc(m.text)+'</div><button class="btn" onclick="openSurah('+m.surah.number+')">Open surah</button></article>'});app.innerHTML=html}catch(e){app.innerHTML='<div class="empty">Search failed. Try again.</div>'}}
async function randomAyah(){try{let r=await fetch('https://api.alquran.cloud/v1/ayah/random/editions/quran-uthmani,en.sahih');let j=await r.json(),ar=j.data[0],en=j.data[1];document.getElementById('modalBody').innerHTML=`<h2>Random Ayah</h2><div class="arabic" translate="no">${esc(ar.text)}</div><p>${esc(en.text)}</p><p class="muted">${esc(ar.surah.englishName)} ${ar.numberInSurah}</p><button class="btn" onclick="openSurah(${ar.surah.number});document.getElementById('modal').classList.remove('open')">Open surah</button>`;document.getElementById('modal').classList.add('open')}catch(e){toast('Could not fetch a random ayah')}}
function toast(msg){let x=document.createElement('div');x.textContent=msg;x.style='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#17221c;color:white;padding:10px 14px;border-radius:999px;z-index:99';document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').hidden=false});document.getElementById('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').hidden=true}};
function getTheme(){return localStorage.getItem('deenColorTheme')||'white'}
function updateTopProfile(){let b=document.getElementById('profileTop');if(!b)return;let p=state.profile;if(p){b.textContent=p.avatar||'🐼';b.title=p.name?`Profile: ${p.name}`:'Profile';b.innerHTML=`${p.avatar||'🐼'}<span style="font-size:13px">${p.gender==='male'?'👳':'🧕'}</span>`}}
function themePanel(){let current=getTheme();document.getElementById('modalBody').innerHTML=`<h2>🎨 Appearance</h2><p class="muted">Keep it simple: bright white or comfortable dark mode.</p><div class="theme-panel"><button class="theme-dot ${current==='white'?'active':''}" onclick="setTheme('white')">🤍 White</button><button class="theme-dot ${current==='dark'?'active':''}" onclick="setTheme('dark')">🌙 Dark</button></div>`;document.getElementById('modal').classList.add('open')}
function setTheme(t){document.body.classList.toggle('dark',t==='dark');localStorage.setItem('deenColorTheme',t);document.getElementById('modal').classList.remove('open');toast((t==='dark'?'Dark':'White')+' mode applied ✓')}
document.getElementById("themeBtn").onclick=themePanel;setTheme(getTheme());updateTopProfile();document.getElementById('goSearch').onclick=searchQ;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchQ()});document.getElementById('randomBtn').onclick=randomAyah;document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});renderNav();home();schedulePrayerCheck();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
